<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>STEPS</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#121216;--surface:#1A1A20;--surface2:#24242C;--border:#2C2C36;--text:#F1F1F5;--muted:#8B8B99;--off:#34343F;--accent:#B4A7EE;--on-accent:#1D1D24;--accent-soft:rgba(180,167,238,.16);--green:#5FC98A;--red:#EF6B73;--blue:#7FB5FF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{overscroll-behavior-y:none;transition:background .25s}
button{font:inherit;color:inherit;cursor:pointer}
#view{max-width:560px;margin:0 auto;padding:calc(var(--tg-content-safe-area-inset-top,0px) + var(--tg-safe-area-inset-top,0px) + 18px) 16px calc(100px + env(safe-area-inset-bottom))}
.ic{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
h1{font-size:26px;font-weight:750;margin:2px 0 2px;letter-spacing:-.4px}
h2{font-size:20px;font-weight:750;margin:0 0 14px;letter-spacing:-.2px}
h3{font-size:16px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:8px}
h3 .ic{color:var(--accent)}
.sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.cap{color:var(--muted);font-size:12px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:650;display:inline-flex;gap:8px;align-items:center;justify-content:center;transition:transform .12s,filter .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.primary{background:var(--accent);color:var(--on-accent)}
.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.small{padding:8px 12px;font-size:13px;border-radius:11px}
.danger{color:var(--red)}
.actions{display:flex;gap:8px;margin:0 0 14px}
.actions .btn{flex:1}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:12px;padding:7px 12px;font-size:13px;font-weight:650;transition:.18s}
.seg.fill button{flex:1;padding:7px 4px}
.seg button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 14px}
.kv{font-size:20px;font-weight:750;letter-spacing:-.3px}
.kc{font-size:12px;color:var(--muted)}
/* цель */
.goal{display:flex;gap:16px;align-items:center}
.gt{font-size:19px;font-weight:750;letter-spacing:-.2px}
.gt.ok{color:var(--green)}
.gs{font-size:13px;color:var(--muted);margin-top:3px}
.glabel{font-size:11px;font-weight:700;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.ring text{font-family:inherit}
.ring-p{animation:ringIn 1s cubic-bezier(.2,.8,.2,1)}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.strip{display:flex;justify-content:space-between;margin-top:16px}
.sd{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0}
.sc{width:var(--cs,32px);height:var(--cs,32px);border-radius:50%;border:2px solid var(--off);display:grid;place-items:center;font-size:13px;font-weight:750;animation:pop .45s backwards}
.sc.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.sc.rest{background:rgba(127,181,255,.18);border-color:transparent;color:var(--blue)}
.sd.today .sc{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--accent)}
.sw{font-size:11px;color:var(--muted)}
.sd.today .sw{color:var(--text);font-weight:700}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.note{margin-top:12px;font-size:13px;color:var(--blue);display:flex;gap:6px;align-items:center}
/* история */
.mh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px;font-weight:700}
.mh span{font-size:12px;font-weight:500;color:var(--muted)}
.wi{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 14px;margin-bottom:8px;transition:transform .12s;animation:fadeUp .35s backwards}
.wi:active{transform:scale(.985)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
.wd{width:44px;text-align:center;flex:none}
.wd b{display:block;font-size:22px;line-height:1.1;font-weight:750}
.wd small{font-size:11px;color:var(--muted)}
.wm{flex:1;min-width:0}
.l1{font-weight:650;font-size:14px}
.l2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wr{text-align:right;flex:none}
.wr small{display:block;font-size:11px;font-weight:650;margin-top:3px}
.dots{display:inline-flex;gap:4px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--off)}
.empty{text-align:center;padding:28px 18px}
.empty .badge{margin:0 auto 12px}
.badge{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.more{display:block;margin:6px auto 0}
/* графики */
.bars{display:flex;align-items:stretch;height:170px;gap:3px;margin-top:12px}
.bar{flex:1;display:flex;flex-direction:column;min-width:0}
.bv{height:16px;font-size:10px;text-align:center;font-weight:650;white-space:nowrap}
.bcol{flex:1;display:flex;align-items:flex-end;justify-content:center}
.bfill{width:min(72%,26px);background:var(--accent);border-radius:7px 7px 3px 3px;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) backwards;transition:filter .15s}
.bfill.zero{background:var(--off)}
.bar.sel .bfill{filter:brightness(1.15);box-shadow:0 0 0 2px var(--text)}
@keyframes grow{from{transform:scaleY(0)}}
.bl{height:18px;font-size:10px;color:var(--muted);text-align:center;white-space:nowrap;overflow:visible;padding-top:4px}
.chartcap{font-size:12px;color:var(--muted);margin-top:8px;min-height:17px}
.chart-empty{height:150px;display:grid;place-items:center;color:var(--muted);font-size:14px}
.line{width:100%;height:auto;display:block;margin-top:10px}
.line .draw{stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 1.2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fd{display:grid;grid-template-columns:86px 1fr 62px;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.fdb{height:12px;border-radius:6px;background:var(--off);overflow:hidden}
.fdb i{display:block;height:100%;border-radius:6px;animation:growX .7s cubic-bezier(.2,.8,.2,1) backwards;transform-origin:left}
@keyframes growX{from{transform:scaleX(0)}}
/* вес */
.huge{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.delta{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:650}
.pbar{height:10px;border-radius:5px;background:var(--off);position:relative;margin:30px 0 22px}
.pfill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent);animation:growX .9s cubic-bezier(.2,.8,.2,1) backwards}
.pmark{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--text);border:3px solid var(--surface)}
.plab{position:absolute;bottom:16px;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap}
.pends{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.bmi{height:10px;border-radius:5px;position:relative;margin:12px 0 22px;background:linear-gradient(90deg,#7FB5FF 0 14%,#5FC98A 14% 40%,#F2D064 40% 60%,#EF6B73 60%)}
.bmi .pmark{top:50%}
.bmi-t{position:absolute;top:14px;font-size:10px;color:var(--muted);transform:translateX(-50%)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.mini .kpi{padding:10px 12px}
.mini .kv{font-size:16px}
.ki{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:11px 14px;margin-bottom:6px}
/* статистика */
.recs{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.rv{font-size:16px;font-weight:750}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.at{background:var(--surface2);border-radius:16px;padding:12px;position:relative;border:1px solid transparent}
.at.done{border-color:var(--accent);background:var(--accent-soft)}
.at.off{opacity:.55}
.at .badge{width:38px;height:38px}
.at b{display:block;font-size:13.5px;margin-top:8px;line-height:1.25}
.at small{font-size:11.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.3}
.at em{position:absolute;right:12px;top:12px;font-style:normal;font-size:10.5px;color:var(--muted)}
.at .ck{position:absolute;right:10px;top:10px;color:var(--green)}
.ap{height:4px;border-radius:2px;background:var(--off);margin-top:10px;overflow:hidden}
.ap i{display:block;height:100%;border-radius:2px;background:var(--accent)}
.at.done .ap i{background:var(--green)}
/* профиль */
.prof{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.ava{width:64px;height:64px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:26px;font-weight:750;background:var(--accent);color:var(--on-accent);overflow:hidden;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.ava img{width:100%;height:100%;object-fit:cover}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--green)}
.sync.err i{background:var(--red)}
.sync.load i{background:var(--accent);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.swc{width:36px;height:36px;border-radius:50%;border:0;position:relative}
.swc.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:var(--surface2);border-radius:10px;padding:6px 10px;font-size:12.5px}
.hr{height:1px;background:var(--border);margin:14px 0}
/* формы */
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;min-width:0}
.f>span{font-size:12px;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inp{background:var(--surface2);border:1px solid transparent;border-radius:14px;padding:12px 14px;color:var(--text);font:inherit;font-size:16px;width:100%;min-height:50px;-webkit-appearance:none;appearance:none}
.inp:focus{outline:none;border-color:var(--accent)}
input[type=date].inp{display:block}
.stp{display:flex;align-items:center;background:var(--surface2);border-radius:14px;padding:5px;min-height:50px}
.sb{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;touch-action:none;flex:none;user-select:none;-webkit-user-select:none;transition:transform .1s}
.sb:active{transform:scale(.9);border-color:var(--accent)}
.sv{flex:1;display:flex;align-items:baseline;justify-content:center;gap:4px;min-width:0}
.sv input{width:2.9em;min-width:0;text-align:right;background:none;border:0;color:var(--text);font:inherit;font-size:17px;font-weight:700;padding:0}
.sv input:focus{outline:none}
.sv em{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap}
.feel{display:flex;gap:12px;align-items:center}
.feel button{width:38px;height:38px;border-radius:50%;border:0;background:var(--off);transition:transform .18s,background .2s}
.feel button.on{background:var(--c)}
.feel button:active{transform:scale(1.25)}
.feel-l{font-weight:650;font-size:14px;margin-left:4px}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 14px}
.preview{font-size:14px;color:var(--muted);font-weight:650;margin:2px 0 16px}
.sheet-btns{display:flex;gap:8px}
.sheet-btns .primary{flex:1}
/* шторка */
#sw{position:fixed;inset:0;z-index:30;pointer-events:none;visibility:hidden;transition:visibility 0s .34s}
#sw.open{pointer-events:auto;visibility:visible;transition:none}
#sbd{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .25s}
#sw.open #sbd{opacity:1}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto;border-top:1px solid var(--border)}
#sw.open #sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--off);margin:0 auto 14px}
/* навигация */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--border)}
@supports (backdrop-filter:blur(1px)){#tabs{background:var(--tabs-bg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}}
.tab{flex:1;max-width:110px;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:650;padding:4px 0}
.ti{width:52px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .2s,color .2s}
.tab.on{color:var(--text)}
.tab.on .ti{background:var(--accent);color:var(--on-accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:40;background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:11px 12px 11px 16px;display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;transition:.25s;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{border:1px solid var(--border);background:transparent;border-radius:10px;padding:6px 10px;font-weight:650;font-size:13px;color:var(--accent)}
#cg{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);padding:24px}
#cg.show{display:flex;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.cgc{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px 22px 22px;text-align:center;max-width:360px;width:100%;animation:popIn .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes popIn{from{transform:scale(.8);opacity:0}}
.cgc .badge{width:80px;height:80px;margin:0 auto 14px}
.cgc h2{margin:0 0 6px}
.cgc p{margin:6px 0 18px}
.confetti{position:fixed;inset:0;z-index:60;pointer-events:none;width:100%;height:100%}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}

/* ---- праздничные итоги недели ---- */
.fest{position:relative;overflow:hidden;border-radius:24px;padding:18px 18px 16px;margin-bottom:12px;color:var(--on-accent);
  background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);animation:festIn .55s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes festIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
.fest::before,.fest::after{content:"";position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,.38),rgba(255,255,255,0) 70%)}
.fest::before{width:260px;height:260px;right:-90px;top:-120px}
.fest::after{width:200px;height:200px;left:-80px;bottom:-110px;opacity:.7}
.fest>*{position:relative;z-index:1}
.fest .cf{position:absolute;z-index:0;pointer-events:none;border-radius:2px;animation:cfFall var(--d) ease-in-out var(--dl) infinite alternate}
@keyframes cfFall{from{transform:translateY(-6px) rotate(var(--r))}to{transform:translateY(8px) rotate(calc(var(--r) + 90deg))}}
.fest .wm{position:absolute;right:-18px;bottom:-22px;z-index:0;opacity:.08;pointer-events:none}
.fhead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fpill{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.10);font-size:10.5px;font-weight:800;letter-spacing:.12em}
.fhead .per{font-weight:750;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx{width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.10);color:inherit;display:grid;place-items:center;flex:none}
.fx:active{transform:scale(.9)}
.fhero{font-size:42px;font-weight:850;letter-spacing:-.02em;line-height:1.05}
.fsub{opacity:.72;font-size:13px;margin:2px 0 8px}
.fdelta{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:999px;background:var(--on-accent);color:var(--accent);font-size:12px;font-weight:750}
.fbars{display:flex;gap:6px;align-items:flex-end;height:96px;margin:30px 0 4px}
.fbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.fbar .ft{flex:1;width:100%;border-radius:9px;background:rgba(0,0,0,.07);display:flex;align-items:flex-end;position:relative}
.fbar .ff{width:100%;border-radius:9px;background:currentColor;opacity:.35;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards}
.fbar.best .ff{opacity:.9}
.fbar .fv{position:absolute;left:50%;transform:translateX(-50%);font-size:10.5px;font-weight:800;white-space:nowrap;animation:fadeIn .4s .8s backwards}
.fbar small{font-size:10.5px;opacity:.65}
.fbar.best small{opacity:1;font-weight:800}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.42);font-size:12.5px;font-weight:650}
.fest.dk .fchip{background:rgba(0,0,0,.20)}
.fq{display:flex;gap:8px;font-style:italic;font-weight:600;font-size:14px;line-height:1.35}
.fq b{font-size:34px;line-height:.8;opacity:.35;font-style:normal}
.gsbtn{margin-top:10px}

/* ---- друзья ---- */
.fav{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--accent);color:var(--on-accent);overflow:hidden}
.fav img{width:100%;height:100%;object-fit:cover}
.fav.s{width:26px;height:26px;font-size:12px}
.fc{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:12px 12px 12px 14px;margin-bottom:8px;animation:fadeUp .35s backwards}
.fc .fm{flex:1;min-width:0}
.fc b{font-size:15px}
.fc .u{color:var(--muted);font-size:12px;margin-left:6px}
.fc .l2{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.fc .gr{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none;width:64px}
.fc .gr small{font-size:10.5px;font-weight:650;color:var(--muted);text-align:center;line-height:1.15}
.fc .gr small.ok{color:var(--green)}
.fc .rm{border:0;background:none;color:var(--muted);padding:6px;border-radius:10px;flex:none}
.fstreak{display:inline-flex;align-items:center;gap:3px;color:var(--accent);font-weight:700;font-size:12px;margin-left:6px}
.rk{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:12px}
.rk.me{background:var(--accent-soft)}
.rk .pl{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted);flex:none}
.rk .pl.m1{background:#F2C94C;color:#1D1D24}.rk .pl.m2{background:#C9CED6;color:#1D1D24}.rk .pl.m3{background:#D9A273;color:#1D1D24}

function cs(method, ...args){
  return new Promise((res, rej) => {
    try { tg.CloudStorage[method](...args, (err, val) => err ? rej(err) : res(val)); } catch (e) { rej(e); }
  });
}
let cloudPtr = null, saveTimer = null, saving = false, dirty = false, syncState = hasCloud ? 'load' : 'local';
function setSync(s){ syncState = s; const el = $('#sync'); if (el) el.outerHTML = syncHTML(); }
function persist(){
  db.updated = Date.now();
  invalidate();
  try { localStorage.setItem(LS, JSON.stringify(db)); } catch (e) {}
  if (!hasCloud) return;
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 500);
}
function save(){ persist(); scheduleSync(1500); }
async function flush(){
  if (!hasCloud || saving || !dirty) return;
  saving = true; dirty = false; setSync('load');
  try {
    const s = JSON.stringify(db), parts = [];
    for (let i = 0; i < s.length; i += CH) parts.push(s.slice(i, i + CH));
    const oldSlot = cloudPtr ? cloudPtr[0] : 'b', oldN = cloudPtr ? +cloudPtr.slice(1) : 0;
    const slot = oldSlot === 'a' ? 'b' : 'a';          // пишем во второй слот, потом переключаем указатель
    for (let i = 0; i < parts.length; i++) await cs('setItem', `${slot}_${i}`, parts[i]);
    await cs('setItem', 'ptr', slot + parts.length);
    cloudPtr = slot + parts.length;
    if (oldN) { const rm = []; for (let i = 0; i < oldN; i++) rm.push(`${oldSlot}_${i}`); try { await cs('removeItems', rm); } catch (e) {} }
    setSync('ok');
  } catch (e) { dirty = true; setSync('err'); }
  saving = false;
  if (dirty) saveTimer = setTimeout(flush, 2000);
}
async function cloudLoad(){
  const ptr = await cs('getItem', 'ptr');
  if (!ptr) return null;
  const slot = ptr[0], n = +ptr.slice(1), keys = [];
  for (let i = 0; i < n; i++) keys.push(`${slot}_${i}`);
  const obj = await cs('getItems', keys);
  return {ptr, data:JSON.parse(keys.map(k => obj[k] || '').join(''))};
}

const TOK = 'steps_tok_' + (tgUser ? tgUser.id : 'local');
const COLL = {workout:() => db.workouts, weight:() => db.weights, plan:() => db.plans};
let srvState = inTG ? 'load' : 'off', srvUser = null, lastSync = 0, syncing = false, syncAgain = false, syncTimer = null;

function touch(kind, item){                 // запись изменена на этом устройстве
  const key = kind + ':' + item.id;
  item.updated = Math.max(Date.now(), (item.updated || 0) + 1, (db.tomb[key] || 0) + 1);
  delete db.tomb[key];
  db.sync.dirty[key] = 1;
}
function tombstone(kind, item){             // запись удалена — помним, чтобы удалить и на других
  const key = kind + ':' + item.id;
  db.tomb[key] = Math.max(Date.now(), (item.updated || 0) + 1);
  db.sync.dirty[key] = 1;
}
function touchMeta(id){
  db.metaU[id] = Math.max(Date.now(), (db.metaU[id] || 0) + 1);
  db.sync.dirty['meta:' + id] = 1;
}
function metaData(id){
  if (id === 'profile') return {name:db.profile.name || '', birth:db.profile.birth || '', sex:db.profile.sex || '', height:+db.profile.height || 0};
  if (id === 'settings') return {goal:db.settings.goal, accent:db.settings.accent};
  return db.weight_goal || {};
}
function applyMeta(id, d){
  d = d || {};
  if (id === 'profile') {
    if (typeof d.name === 'string') db.profile.name = d.name.slice(0, 32);
    if (d.birth === '' || ISO_RE.test(d.birth || '')) db.profile.birth = d.birth;
    if (['', 'm', 'f'].includes(d.sex)) db.profile.sex = d.sex;
    if (d.height != null) db.profile.height = +d.height || 0;
  } else if (id === 'settings') {
    if (d.goal && d.goal.count) db.settings.goal = {count:+d.goal.count, days:+d.goal.days || 7};
    if (ACCENTS.some(a => a[0] === d.accent)) db.settings.accent = d.accent;
  } else if (id === 'weight_goal') db.weight_goal = (d && typeof d === 'object') ? d : {};
}
function splitKey(key){ const i = key.indexOf(':'); return [key.slice(0, i), key.slice(i + 1)]; }
function curUpdated(key){
  const [kind, id] = splitKey(key);
  if (kind === 'meta') return db.metaU[id] || 0;
  const it = (COLL[kind] ? COLL[kind]() : []).find(x => String(x.id) === id);
  return it ? (it.updated || 0) : (db.tomb[key] || 0);
}
function markAllDirty(){
  for (const kind of Object.keys(COLL)) for (const it of COLL[kind]()) {
    if (!it || it.id == null) continue;
    if (!it.updated) it.updated = Math.round((+it.created || 0) * 1000) || 1;
    db.sync.dirty[kind + ':' + it.id] = 1;
  }
  // профиль/настройки отправляем, только если в них что-то заполнено:
  // пустое новое устройство должно принять данные с сервера, а не затереть их
  const g = db.settings.goal || {};
  const has = {profile:!!(db.profile.name || db.profile.birth || db.profile.sex || +db.profile.height),
    settings:(g.count && +g.count !== 5) || (g.days && +g.days !== 7) || db.settings.accent !== 'lavender',
    weight_goal:!!(db.weight_goal && db.weight_goal.target)};
  for (const id of Object.keys(has)) if (has[id] || db.metaU[id]) { if (!db.metaU[id]) db.metaU[id] = 1; db.sync.dirty['meta:' + id] = 1; }
}
function pendingRows(){
  const rows = [];
  for (const key of Object.keys(db.sync.dirty)) {
    const [kind, id] = splitKey(key);
    if (kind === 'meta') { rows.push({kind, id, data:metaData(id), updated:db.metaU[id] || 1, deleted:false}); continue; }
    if (!COLL[kind]) { delete db.sync.dirty[key]; continue; }
    const it = COLL[kind]().find(x => String(x.id) === id);
    if (it) { const data = Object.assign({}, it); delete data.updated; rows.push({kind, id, data, updated:it.updated || 1, deleted:false}); }
    else if (db.tomb[key]) rows.push({kind, id, data:{}, updated:db.tomb[key], deleted:true});
    else delete db.sync.dirty[key];
    if (rows.length >= 2500) break;
  }
  return rows;
}
function applyRemote(rows){
  let changed = false;
  for (const r of rows) {
    const key = r.kind + ':' + r.id, ru = +r.updated || 0;
    if (r.kind === 'meta') {
      if (ru > (db.metaU[r.id] || 0)) { applyMeta(r.id, r.data); db.metaU[r.id] = ru; delete db.sync.dirty[key]; changed = true; }
      continue;
    }
    if (!COLL[r.kind]) continue;
    const arr = COLL[r.kind](), idx = arr.findIndex(x => String(x.id) === String(r.id));
    const lu = Math.max(idx >= 0 ? (arr[idx].updated || 0) : 0, db.tomb[key] || 0);
    if (ru <= lu) continue;                               // у нас свежее или то же самое
    if (r.deleted) { if (idx >= 0) arr.splice(idx, 1); db.tomb[key] = ru; }
    else {
      const item = Object.assign({}, r.data || {}, {id:String(r.id), updated:ru});
      if (idx >= 0) arr[idx] = item; else arr.push(item);
      delete db.tomb[key];
    }
    delete db.sync.dirty[key];
    changed = true;
  }
  return changed;
}
async function api(route, body){
  const r = await fetch(API + route, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || ('HTTP ' + r.status)); e.status = r.status; throw e; }
  return j;
}
async function ensureToken(force){
  let t = null;
  if (!force) { try { t = localStorage.getItem(TOK); } catch (e) {} }
  if (t) return t;
  const j = await api('/tg-webapp', {initData:tg.initData});
  try { localStorage.setItem(TOK, j.token); } catch (e) {}
  srvUser = j.user;
  return j.token;
}
function setSrv(s){ srvState = s; const el = $('#sync'); if (el) el.outerHTML = syncHTML(); }
function scheduleSync(ms){ if (!inTG) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, ms); }
async function syncNow(){
  if (!inTG) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSrv('load');
  try {
    let tok = await ensureToken(false);
    if (!db.sync.init) { markAllDirty(); db.sync.init = true; }
    const rows = pendingRows(), snap = rows.map(r => [r.kind + ':' + r.id, r.updated]);
    const body = {since:db.sync.rev || 0, rows};
    let res;
    try { res = await api('/sync', Object.assign({token:tok}, body)); }
    catch (e) {
      if (e.status !== 401) throw e;
      tok = await ensureToken(true);                       // сессия протухла — войти заново
      res = await api('/sync', Object.assign({token:tok}, body));
    }
    for (const [k, u] of snap) if (curUpdated(k) === u) delete db.sync.dirty[k];
    const changed = applyRemote(res.rows || []);
    db.sync.rev = Math.max(db.sync.rev || 0, +res.rev || 0);
    srvUser = res.user || srvUser;
    lastSync = Date.now();
    persist();
    if (changed && !sheetCtx) { applyTheme(); render(); }
    setSrv(Object.keys(db.sync.dirty).length ? 'load' : 'ok');
    if (Object.keys(db.sync.dirty).length) syncAgain = true;   // остался хвост больше 2500 записей
  } catch (e) { setSrv('err'); }
  syncing = false;
  if (syncAgain) { syncAgain = false; scheduleSync(400); }
}

function hexRgb(h){ const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function themeMode(){
  const t = db.settings.theme;
  if (t === 'light' || t === 'dark') return t;
  if (tg && tg.colorScheme) return tg.colorScheme;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function accentHex(mode){
  const k = db.settings.accent;
  if (k === 'mono') return mode === 'dark' ? '#EDEDF2' : '#26262C';
  const a = ACCENTS.find(x => x[0] === k); return a ? a[2] : '#B4A7EE';
}
function applyTheme(){
  const mode = themeMode(), th = THEMES[mode], r = document.documentElement.style;
  for (const k in th) r.setProperty('--' + k, th[k]);
  const acc = accentHex(mode), [ar, ag, ab] = hexRgb(acc);
  r.setProperty('--accent', acc);
  r.setProperty('--on-accent', (0.299*ar + 0.587*ag + 0.114*ab) > 140 ? '#1D1D24' : '#FFFFFF');
  r.setProperty('--accent-soft', `rgba(${ar},${ag},${ab},.16)`);
  r.setProperty('--accent2', accent2(acc));
  const [sr, sg, sb] = hexRgb(th.surface);
  r.setProperty('--tabs-bg', `rgba(${sr},${sg},${sb},.86)`);
  try {
    if (ver('6.1')) { tg.setBackgroundColor(th.bg); tg.setHeaderColor(ver('6.9') ? th.bg : 'bg_color'); }

function confetti(){
  const c = document.createElement('canvas'); c.className = 'confetti'; document.body.appendChild(c);
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  const x = c.getContext('2d'); x.scale(dpr, dpr);
  const cols = ACCENTS.map(a => a[2]).concat([GREEN, RED, YELLOW, BLUE]);
  const P = [], mk = (px, py, vx, vy, g) => ({x:px, y:py, vx, vy, g, a:Math.random()*6.28, va:(Math.random()-.5)*16,
    f:Math.random()*6.28, vf:4 + Math.random()*6, w:6 + Math.random()*5, h:4 + Math.random()*3, c:cols[Math.random()*cols.length|0], o:Math.random() < .25});
  for (let s = 0; s < 2; s++) for (let i = 0; i < 55; i++) {
    const ang = (60 + Math.random()*25) * Math.PI / 180, sp = (600 + Math.random()*450) * Math.min(1, H / 800);
    P.push(mk(s ? W : 0, H + 5, Math.cos(ang) * sp * (s ? -1 : 1) * .6, -Math.sin(ang) * sp, 1300));
  }
  let t0 = performance.now(), prev = t0;
  (function step(now){
    const dt = Math.min(.05, (now - prev) / 1000); prev = now;
    const el = (now - t0) / 1000;
    if (el < 2) for (let k = 0; k < 2; k++) P.push(mk(Math.random()*W, -10, (Math.random()-.5)*80, 60 + Math.random()*100, 220));
    x.clearRect(0, 0, W, H);

  });
  if (rev.length > S.klimit) h += `<button class="btn ghost small more" data-act="kmore">Показать ещё (осталось ${rev.length - S.klimit})</button>`;

}

  const g = G(), before = goalCycles(valid()).done;
  let w = item;
  if (w) Object.assign(w, data); else { w = Object.assign({id:uid(), created:nowSec()}, data); db.workouts.push(w); }
  touch('workout', w);
  save(); closeSheet(); render(); hap.ok();
  toast(item ? 'Тренировка обновлена' : 'Тренировка сохранена');
  const after = goalCycles(valid()).done;
  if (after > before) setTimeout(() => celebrate('trophy', 'Норма выполнена!', `${npw(g.count, W_WORK)} за ${npw(g.days, W_DAY)}`, CG_LINES), 350);
}
function delWorkout(){
  const w = sheetCtx.item, idx = db.workouts.indexOf(w); if (idx < 0) return;
  db.workouts.splice(idx, 1); tombstone('workout', w); save(); closeSheet(); render(); hap.warn();
  toast('Тренировка удалена', 'Отменить', () => { db.workouts.splice(Math.min(idx, db.workouts.length), 0, w); touch('workout', w); save(); render(); });
}
function checkWeightGoal(before){
  const goal = db.weight_goal || {}, after = weightGoalState(goal, currentWeight());
  if (after && after.reached && !(before && before.reached) && !goal.reached_on) {
    goal.reached_on = isoOf(todayN()); touchMeta('weight_goal'); save();
    setTimeout(() => celebrate('target', 'Цель по весу достигнута!', `Ты дошёл до ${num(after.target)} кг`, CGW_LINES), 350);
  }
}
function saveWeight(){
  const item = sheetCtx.item, before = weightGoalState(db.weight_goal, currentWeight());
  const data = {date:ISO_RE.test($('#k-date').value) ? $('#k-date').value : isoOf(todayN()), kg:stpVal('kg'), note:$('#k-note').value.trim()};
  let k = item;
  if (k) Object.assign(k, data); else { k = Object.assign({id:uid(), created:nowSec()}, data); db.weights.push(k); }
  touch('weight', k);
  save(); closeSheet(); render(); hap.ok();
  toast(item ? 'Взвешивание обновлено' : `Записал: ${num(data.kg)} кг`);
  checkWeightGoal(before);
}
function delWeight(){
  const e = sheetCtx.item, idx = db.weights.indexOf(e); if (idx < 0) return;
  db.weights.splice(idx, 1); tombstone('weight', e); save(); closeSheet(); render(); hap.warn();
  toast('Взвешивание удалено', 'Отменить', () => { db.weights.splice(Math.min(idx, db.weights.length), 0, e); touch('weight', e); save(); render(); });
}
function saveGoal(){
  db.weight_goal = {start:stpVal('gstart'), target:stpVal('gtarget'), start_date:isoOf(todayN())};
  touchMeta('weight_goal'); save(); closeSheet(); render(); hap.ok(); toast('Цель сохранена'); checkWeightGoal(null);
}

/* ------------------------------------------------- импорт / экспорт --- */
function importFile(file){
  const r = new FileReader();
  r.onload = async () => {
    let d;
    try { d = JSON.parse(r.result); if (!d || !Array.isArray(d.workouts)) throw 0; }
    catch (e) { toast('Это не похоже на копию STEPS'); hap.warn(); return; }
    const wIds = new Set(db.workouts.map(w => String(w.id))), kIds = new Set(db.weights.map(w => String(w.id)));
    const wKey = w => `${w.date}|${w.minutes}|${w.speed}|${w.incline}`, wKeys = new Set(db.workouts.map(wKey));
    const newW = d.workouts.filter(w => w && ISO_RE.test(w.date || '') && !(w.id && wIds.has(String(w.id))) && !wKeys.has(wKey(w)));
    const newK = (Array.isArray(d.weights) ? d.weights : []).filter(e => e && ISO_RE.test(e.date || '') && +e.kg > 0 && !(e.id && kIds.has(String(e.id))));
    if (!newW.length && !newK.length) { toast('Всё уже импортировано — новых записей нет'); return; }
    if (!(await ask(`Нашёл новых записей: ${npw(newW.length, W_WORK)}, взвешиваний: ${newK.length}. Добавить?`))) return;
    const n0w = db.workouts.length, n0k = db.weights.length, n0p = db.plans.length;
    for (const w of newW) db.workouts.push({id:String(w.id || uid()), date:w.date, minutes:clamp(Math.round(+w.minutes || 1), 1, 600),
      speed:clamp(+w.speed || 0.5, 0.5, 12), incline:clamp(Math.round(+w.incline || 0), 0, 15), feeling:clamp(parseInt(w.feeling) || 3, 1, 5),
      note:String(w.note || '').slice(0, 140), created:+w.created || nowSec()});
    for (const e of newK) db.weights.push({id:String(e.id || uid()), date:e.date, kg:+(+e.kg).toFixed(1), note:String(e.note || '').slice(0, 100), created:+e.created || nowSec()});
    const p = d.profile || {};
    if (!db.profile.name && p.name) db.profile.name = String(p.name).slice(0, 32);
    if (!db.profile.birth && ISO_RE.test(p.birth || '')) db.profile.birth = p.birth;
    if (!db.profile.sex && (p.sex === 'm' || p.sex === 'f')) db.profile.sex = p.sex;
    if (!(+db.profile.height) && +p.height) db.profile.height = Math.round(+p.height);
    if (!(db.weight_goal || {}).target && d.weight_goal && d.weight_goal.target) db.weight_goal = d.weight_goal;
    if (d.settings && d.settings.goal && d.settings.goal.count) db.settings.goal = {count:+d.settings.goal.count, days:+d.settings.goal.days || 7};
    if (d.settings && ACCENTS.some(a => a[0] === d.settings.accent)) db.settings.accent = d.settings.accent;
    if (Array.isArray(d.plans)) { const ids = new Set(db.plans.map(x => x.id)); d.plans.forEach(x => { if (x && x.id && !ids.has(x.id)) db.plans.push(Object.assign({}, x, {id:String(x.id)})); }); }
    db.workouts.slice(n0w).forEach(w => touch('workout', w));
    db.weights.slice(n0k).forEach(k => touch('weight', k));
    db.plans.slice(n0p).forEach(x => touch('plan', x));
    touchMeta('profile'); touchMeta('settings'); touchMeta('weight_goal');
    save(); applyTheme(); render(); hap.ok();
    toast(`Добавлено: ${npw(newW.length, W_WORK)}, взвешиваний: ${newK.length}`);
  };
  r.readAsText(file);
}
async function copyBackup(){
  // формат совместим с «Восстановить» в STEPS для Windows
  const strip = a => a.map(x => { const c = Object.assign({}, x); delete c.updated; return c; });
  const data = {profile:db.profile, settings:{goal:db.settings.goal, accent:db.settings.accent}, workouts:strip(db.workouts), weights:strip(db.weights),
    weight_goal:db.weight_goal, plans:strip(db.plans), app:APP, saved_at:new Date().toISOString().slice(0, 19)};
  const s = JSON.stringify(data);
  let ok = false;
  try { await navigator.clipboard.writeText(s); ok = true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand('copy'); } catch (_) {} ta.remove();
  }
  if (ok) { hap.ok(); toast('Копия в буфере — вставь в «Избранное» или в файл .json'); } else toast('Не получилось скопировать');
}

/* ============================================================ события === */
const ACT = {
  tab: el => { if (S.tab !== el.dataset.tab) { S.tab = el.dataset.tab; render(); window.scrollTo(0, 0); hap.tap(); if (S.tab === 'friends') loadFriends(); } },
  add: () => openWorkout(null),
  repeat: () => { const l = lastWorkout(); openWorkout(null, l, l ? 'Параметры из прошлой тренировки — поправь, если нужно' : ''); },
  wedit: el => { const w = findW(el.dataset.id); if (w) openWorkout(w); },
  wsave: saveWorkout, wdel: delWorkout,
  frload: () => { FR.err = ''; render(); loadFriends(); },
  frprof: el => { hap.tap(); openFriendProfile(+el.dataset.id); },
  frreq: async el => {
    const id = +el.dataset.id; el.disabled = true;
    try { const j = await apiAuth('/friends/request', {tg_id:id});
      if (j.status === 'requested') { el.outerHTML = '<span class="cap">заявка отправлена</span>'; toast('Заявка отправлена'); hap.ok(); }
      else if (j.status === 'ok') { el.outerHTML = '<span class="cap" style="color:var(--green)">друзья</span>'; toast('Теперь вы друзья 🎉'); hap.ok(); loadFriends(); }
      else { el.disabled = false; toast(j.status === 'limit' ? 'Слишком много друзей' : 'Не получилось'); }
    } catch (e) { el.disabled = false; toast('Нет связи: ' + e.message); } },
  frresp: async el => {
    const id = +el.dataset.id, acc = el.dataset.v === '1';
    try { const j = await apiAuth('/friends/respond', {tg_id:id, accept:acc}); toast(acc && j.status === 'ok' ? 'Теперь вы друзья 🎉' : 'Заявка отклонена'); if (acc) hap.ok(); loadFriends(); }
    catch (e) { toast('Нет связи: ' + e.message); } },
  privacy: async () => {
    if (!inTG) return; const want = !PRIV.v; PRIV.v = want; render(); hap.tap();
    try { const j = await apiAuth('/friends/privacy', {private:want}); PRIV.v = !!j.private; toast(PRIV.v ? 'Профиль закрыт — друзья видят только основное' : 'Профиль открыт для друзей'); }
    catch (e) { PRIV.v = !want; toast('Нет связи: ' + e.message); }
    render(); },
  frshare: () => { if (!FR.data) return; hap.imp();
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(FR.data.link) + '&text=' + encodeURIComponent('Давай вместе ходить в STEPS 👟 Добавь меня в друзья:');
    try { tg.openTelegramLink(url); } catch (e) { copyStr(FR.data.link).then(ok => toast(ok ? 'Ссылка скопирована' : 'Не получилось')); } },
  frcode: async () => { if (FR.data && await copyStr(FR.data.code)) { hap.ok(); toast('Код скопирован — продиктуй его другу'); } },
  fradd: async () => {
    const code = ($('#fr-code').value || '').trim(); if (!code) return;
    try {
      const j = await apiAuth('/friends/add', {code});
      const n = j.name || '';
      const m = {ok:`${n} теперь твой друг 🎉`, already:`Вы с ${n} уже друзья`, self:'Это твой собственный код 🙂', nocode:'Такой код не найден — проверь буквы', limit:'Слишком много друзей — максимум 100'}[j.status] || 'Не получилось';
      toast(m); if (j.status === 'ok') { hap.ok(); loadFriends(); } else hap.warn();
    } catch (e) { toast('Нет связи: ' + e.message); }
  },
  frdel: async el => {
    const id = +el.dataset.id, f = FR.data && FR.data.friends.find(x => x.tg_id === id); if (!f) return;
    if (!(await ask(`Убрать ${f.name} из друзей? Вы перестанете видеть успехи друг друга.`))) return;
    try { await apiAuth('/friends/remove', {tg_id:id}); FR.data.friends = FR.data.friends.filter(x => x.tg_id !== id); if (sheetCtx && sheetCtx.type === 'fprof') closeSheet(); render(); toast(`${f.name} больше не в друзьях`); }
    catch (e) { toast('Нет связи: ' + e.message); }
  },
  gsum: () => { S.gsum = !S.gsum; hap.imp(); render(); },
  sumhide: el => { const seen = (db.settings.summary_seen || []).filter(k => k !== el.dataset.k); seen.push(el.dataset.k);
    db.settings.summary_seen = seen.slice(-20); persist(); hap.tap();
    const card = el.closest('.fest'); if (card) { card.style.transition = 'opacity .25s, transform .25s'; card.style.opacity = 0; card.style.transform = 'scale(.97)'; setTimeout(render, 240); } else render(); },
  more: () => { S.limit += 30; render(); },
  kadd: () => openWeight(null),
  kedit: el => { const e = findK(el.dataset.id); if (e) openWeight(e); },
  ksave: saveWeight, kdel: delWeight,
  kmore: () => { S.klimit += 30; render(); },
  kgoal: openWeightGoal, gsave: saveGoal,
  gdel: () => { db.weight_goal = {}; touchMeta('weight_goal'); save(); closeSheet(); render(); toast('Цель удалена'); },
  seg: el => { S[el.dataset.k] = el.dataset.v; render(); hap.tap(); },
  bar: el => {
    const cap = document.getElementById(el.dataset.cap); if (cap) cap.textContent = el.dataset.tip;
    el.parentElement.querySelectorAll('.bar.sel').forEach(b => b.classList.remove('sel')); el.classList.add('sel'); hap.tap();
  },
  feel: el => {
    const v = +el.dataset.v, box = $('#f-feel'); box.dataset.v = v;
    box.querySelectorAll('button').forEach((b, i) => b.classList.toggle('on', i < v));
    const l = $('#f-feel-l'); l.textContent = FEEL[v][0]; l.style.color = FEEL[v][1]; hap.tap();
  },
  sex: el => { db.profile.sex = el.dataset.v; touchMeta('profile'); save(); render(); hap.tap(); },
  theme: el => { db.settings.theme = el.dataset.v; save(); applyTheme(); render(); hap.tap(); },
  accent: el => { db.settings.accent = el.dataset.v; touchMeta('settings'); save(); applyTheme(); render(); hap.tap(); },
  import: () => $('#file').click(),
  copy: copyBackup,
  close: closeSheet,
  cgok: () => $('#cg').classList.remove('show')
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el);
});
// степперы: нажал — шаг, держишь — повторяется
let rep = null;
const stopRep = () => { clearTimeout(rep); rep = null; };
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.sb'); if (!b) return;
  e.preventDefault();
  const el = b.closest('.stp'), d = +b.dataset.d;
  stepBy(el, d); hap.tap();
  const go = () => { stepBy(el, d); rep = setTimeout(go, 70); };
  stopRep(); rep = setTimeout(go, 380);
  b.addEventListener('pointerleave', stopRep, {once:true});
});
window.addEventListener('pointerup', stopRep);
window.addEventListener('pointercancel', stopRep);
document.addEventListener('input', e => {
  const st = e.target.closest('.stp');
  if (st && sheetCtx) { if (sheetCtx.type === 'workout') updPreview(); if (sheetCtx.type === 'wgoal') updGoalInfo(); }
  if (e.target.id === 'f-date') updPreview();
});
document.addEventListener('change', e => {
  const st = e.target.closest('.stp');
  if (st) { const dec = +st.dataset.dec; st.querySelector('input').value = fmtIn(readStp(st), dec); onStp(st); return; }
  const ch = e.target.dataset.ch;
  if (ch === 'pname') { db.profile.name = e.target.value.trim().slice(0, 32); touchMeta('profile'); save(); toast('Сохранено'); }
  if (ch === 'pbirth') { db.profile.birth = ISO_RE.test(e.target.value) ? e.target.value : ''; touchMeta('profile'); save();
    const c = $('#p-chips'); if (c) { const kg = currentWeight(), h = +db.profile.height || 0, age = ageOf(db.profile.birth); c.innerHTML = chips(age, bmiOf(kg, h), bmrOf(kg, h, age, db.profile.sex)); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.blur(); });
$('#file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) importFile(f); e.target.value = ''; });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (dirty) { clearTimeout(saveTimer); flush(); } if (Object.keys(db.sync.dirty).length) syncNow(); }
  else scheduleSync(200);
});
setInterval(() => { if (!document.hidden) syncNow(); }, 15000);   // пока приложение на экране — проверяем облако часто

/* ============================================================ запуск ==== */
async function init(){
  if (tg) {
    try { tg.ready(); tg.expand(); } catch (e) {}
    try { if (ver('7.7')) tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.onEvent('themeChanged', () => { if (db.settings.theme === 'auto') { applyTheme(); render(); } }); } catch (e) {}
    try { if (ver('6.1')) tg.BackButton.onClick(() => { if ($('#cg').classList.contains('show')) $('#cg').classList.remove('show'); else closeSheet(); }); } catch (e) {}
  }
  try { const s = localStorage.getItem(LS); if (s) db = normalize(JSON.parse(s)); } catch (e) {}
  invalidate(); applyTheme(); render();
  scheduleSync(100);
  if (!hasCloud) return;
  try {
    const c = await cloudLoad();
    if (c) {
      cloudPtr = c.ptr;
      const cd = normalize(c.data);
      if ((cd.updated || 0) > (db.updated || 0)) {
        db = cd; invalidate();
        try { localStorage.setItem(LS, JSON.stringify(db)); } catch (e) {}
        applyTheme(); if (!sheetCtx) render();
      } else if ((db.updated || 0) > (cd.updated || 0)) { dirty = true; flush(); }
    } else if (db.workouts.length || db.weights.length || db.updated) { dirty = true; flush(); }
    setSync(dirty || saving ? 'load' : 'ok');
  } catch (e) { setSync('err'); }
  scheduleSync(300);
}
init();
